<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Solvia Codes</title>
    <script>
      // Single Page Apps for GitHub Pages - Custom Domain (solvia.codes)
      var l = window.location;
      var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var path = l.pathname.replace(/^\/+/, '').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' + path + query + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
